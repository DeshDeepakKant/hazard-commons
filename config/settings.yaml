# Hazard Commons: single source of config. Secrets live in .env, not here.

world:
  # Bandra West residential core (osmnx 2.x bbox order: west, south, east, north)
  bbox_wsen: [72.826, 19.052, 72.842, 19.066]
  epsg: 32643            # UTM 43N
  # Local frame: metres, x=east, y=north, z=up, origin = bbox centre.
  # Exact origin_utm is computed by world/fetch_osm.py and written to world/out/meta.json
  origin_lonlat: [72.834, 19.059]
  out_dir: world/out
  collision_road_buffer_m: 30
  floor_height_m: 3.2

traffic:
  lefthand: true
  seed: 42
  max_vehicles: 150
  max_pedestrians: 120
  net_file: traffic/out/bandra.net.xml
  sumocfg: traffic/sumo.sumocfg

sim:
  seed: 7
  physics_hz: 240
  control_hz: 20
  state_publish_hz: 10
  camera: {width: 320, height: 240, fov_deg: 70}
  lidar: {rays: 31, fov_deg: 120, range_m: 12.0, brake_dist_m: 2.0}
  rover: {max_speed_mps: 4.0, scale: 0.5}
  drone: {cruise_alt_m: 40.0, max_speed_mps: 10.0}
  checkpoint_trigger_dist_m: 18.0
  # Live demo only: replay the scripted story every every_s sim seconds (from each cycle start).
  # Each cycle costs ~3 stakes (0.0001 0G) + gas and ~15-25 0G Router calls. CLI overrides.
  scenario_loop: {enabled: false, every_s: 360, max_cycles: 5}

operators:
  - {id: 0, name: ZipKart,    color: "#ff6b1a", rovers: 3}
  - {id: 1, name: MinuteMart, color: "#2f8cff", rovers: 3}
  - {id: 2, name: DashKirana, color: "#22c55e", rovers: 2}
drones:
  # base_xy (optional, local frame): take-off pad. ZipKart runs its verification drone from a
  # central rooftop hub (closer to the west side of the map); default = a clear pad near the store.
  - {id: D-01, operator: ZipKart, base_xy: [-260, 60]}
  - {id: D-02, operator: MinuteMart}

brain:
  # Mainnet router is reachable; testnet router (router-api-testnet.integratenetwork.work) was not (2026-11-06).
  base_url_env: ZG_ROUTER_BASE_URL
  model_env: ZG_MODEL
  default_model: 0gm-1.0-35b-a3b
  trust_mode: private          # X-0G-Provider-Trust-Mode
  verify_tee: true
  timeout_s: 15                # exceed => SAFE_STOP
  max_retries_invalid_json: 1  # then SAFE_STOP
  max_calls_per_run: 300       # counts only calls that reached the model (2xx); failed calls are refunded
  max_consecutive_failures: 10 # circuit breaker: then pause calls for breaker_cooldown_s (robots SAFE_STOP)
  breaker_cooldown_s: 20
  # Brain profiles: per-checkpoint model routes, chosen explicitly for a whole run
  # (scripts/run_demo.py --brain-profile NAME or ZG_BRAIN_PROFILE). Never an automatic fallback;
  # every decision card shows the model and whether it ran in a TEE.
  profiles:
    # 0gm-1.0-35b-a3b (the only TEE vision model) down: route-ahead decisions are text-only, so they
    # can run on GLM-5.3 (also 0G, TeeML, sealed). Vision checkpoints stay on the default model.
    tee-text:
      CP-H2: {model: glm-5.3, trust_mode: private}
    # As tee-text, plus vision on a NON-TEE 0G model. Needs a Router key that allows trust mode
    # "standard" (ZG_ROUTER_API_KEY, if its key permits it). Every card shows the model and NO TEE.
    outage:
      CP-H2: {model: glm-5.3, trust_mode: private}
      CP-H1: {model: qwen2.5-vl-72b-instruct, trust_mode: standard, verify_tee: false}
      CP-V:  {model: qwen2.5-vl-72b-instruct, trust_mode: standard, verify_tee: false}
    # Used by robot wallets (brain.wallets.economy_profile) for a body whose credit is below the
    # economy threshold. Explicit trust_mode on every route: all checkpoints run on a cheaper NON-TEE
    # 0G model and its cards say NO TEE. Never silently TEE.
    economy:
      # measured 2026-11-07: qwen ~60 micro-USD/call with a photo (~24 text) vs ~90-130 on the TEE model; glm-5.3 (reasoning)
      # cost ~300 and returned no text, so it is not used as an economy route.
      CP-H2: {model: qwen2.5-vl-72b-instruct, trust_mode: standard, verify_tee: false}
      CP-Q:  {model: qwen2.5-vl-72b-instruct, trust_mode: standard, verify_tee: false}
      CP-H1: {model: qwen2.5-vl-72b-instruct, trust_mode: standard, verify_tee: false}
      CP-V:  {model: qwen2.5-vl-72b-instruct, trust_mode: standard, verify_tee: false}
      CP-D:  {model: qwen2.5-vl-72b-instruct, trust_mode: standard, verify_tee: false}

  # Agents That Pay for Themselves: one credit wallet per robot body (brain/wallets.py).
  # Off by default; enable with ZG_WALLETS=1 or scripts/run_demo.py --wallets.
  wallets:
    enabled: false
    start_micro_usd: 3000          # per body, ~30 calls at ~90 micro-USD/call
    max_spend_micro_usd: 6000      # lifetime per-robot spend cap (0 = none)
    economy_fraction: 0.40         # balance/start below -> economy route
    throttled_fraction: 0.15       # below -> throttled (economy route + rate limit)
    min_call_cost_micro_usd: 40    # balance below this -> paused (SAFE_STOP, no model call); ~economy call cost
    throttle_min_interval_s: 20    # throttled: min wall seconds between calls per robot
    economy_profile: economy
    estimate_in_micro_usd_per_1k: 20    # only if the router reports no billing
    estimate_out_micro_usd_per_1k: 60
    income:
      hazard_reward_micro_usd: 600       # chain-confirmed hazard -> reporting robot (source: chain)
      verifier_reward_micro_usd: 150     # verifier drone whose verdict matched the outcome (chain)
      delivery_fee_micro_usd: 300        # SIMULATED flat fee per delivered order (source: simulated)

storage:
  indexer_env: ZG_STORAGE_INDEXER
  sidecar_dir: memory/zg-storage
  upload_every_n_records: 8
  local_mirror: logs/index.json
  explorer: https://storagescan-galileo.0g.ai

chain:
  chain_id: 16602
  rpc_env: ZG_RPC_URL
  explorer: https://chainscan-galileo.0g.ai
  deployments: chain/deployments/galileo.json
  report_stake_wei: 100000000000000   # 0.0001 0G
  confirmations_needed: 1
  disputes_needed: 1
  event_poll_s: 2.0

server:
  host: 127.0.0.1
  port: 8765
